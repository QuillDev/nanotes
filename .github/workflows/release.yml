name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets to (e.g. v0.3.4). Leave empty for build-only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            arch: arm64
            arch_label: aarch64
          - name: macos-x64
            os: macos-latest
            arch: x64
            arch_label: x64
          - name: windows-x64
            os: windows-latest
            arch: x64
            arch_label: x64
          - name: linux-x64
            os: ubuntu-22.04
            arch: x64
            arch_label: x86_64
          - name: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            arch_label: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - name: Determine release target
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "release_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.release_tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'desktop/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Rust stable
        if: matrix.name == 'android-arm64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: matrix.name == 'android-arm64'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}
          cache-on-failure: true

      - name: Setup Java for Android
        if: matrix.name == 'android-arm64'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          if [ "${{ matrix.name }}" != "android-arm64" ]; then
            bun install --cwd desktop --frozen-lockfile
          fi

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build desktop app
        if: matrix.name != 'android-arm64'
        shell: bash
        run: |
          bun run build
          case "${{ matrix.name }}" in
            macos-*) TARGET="--mac dir" ;;
            windows-*) TARGET="--win nsis" ;;
            linux-*) TARGET="--linux deb dir" ;;
          esac
          cd desktop
          ./node_modules/.bin/electron-builder $TARGET --${{ matrix.arch }} --publish never -c.extraMetadata.version="$APP_VERSION"

      - name: Build and package Android APK
        if: matrix.name == 'android-arm64'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.NANOTES_ANDROID_KEYSTORE_BASE64 }}
          NANOTES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NANOTES_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "NANOTES_ANDROID_KEYSTORE_BASE64 secret is required to sign the APK." >&2
            exit 1
          fi
          export NANOTES_ANDROID_KEYSTORE="$RUNNER_TEMP/nanotes-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$NANOTES_ANDROID_KEYSTORE"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bun tauri android build --apk --target aarch64
          mkdir -p release-assets
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk release-assets/nanotes.apk
          ls -lh release-assets

      - name: Package macOS release asset
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          mkdir -p release-assets
          APP_PATH=$(find desktop/dist -maxdepth 2 -name NaNotes.app -type d | head -n 1)
          test -d "$APP_PATH"
          # Electron's own signature breaks once the app is renamed; Apple silicon refuses unsigned apps.
          codesign --force --deep --sign - "$APP_PATH"
          ASSET="release-assets/NaNotes_${APP_VERSION}_${{ matrix.arch_label }}.app.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$APP_PATH")" NaNotes.app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bunx tauri signer sign "$ASSET"
            test -s "${ASSET}.sig"
          fi
          ls -lh release-assets

      - name: Package Windows release asset
        if: matrix.name == 'windows-x64'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem -Path "desktop/dist" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Expected NSIS *-setup.exe installer was not produced.'
          }
          $dest = Join-Path "release-assets" $installer.Name
          Copy-Item -LiteralPath $installer.FullName -Destination $dest
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            bunx tauri signer sign $dest
            if (-not (Test-Path "$dest.sig")) {
              throw "Expected updater signature $dest.sig was not produced."
            }
          }
          Get-ChildItem release-assets
          if (Test-Path "$PWD\install.ps1") {
            $script = Get-Content -Raw -Path "$PWD\install.ps1"
            [void][scriptblock]::Create($script)
            powershell.exe -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw -Path '$PWD\install.ps1'))"
          }

      - name: Package Linux release assets
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          mkdir -p release-assets stage-linux
          DEB_PATH=$(find desktop/dist -maxdepth 1 -name '*.deb' | head -n 1)
          test -n "$DEB_PATH"
          test -x desktop/dist/linux-unpacked/nanotes
          cp "$DEB_PATH" "release-assets/NaNotes_${APP_VERSION}_amd64.deb"
          cp -R desktop/dist/linux-unpacked stage-linux/nanotes
          cp desktop/icons/icon.png stage-linux/nanotes.png
          cat > stage-linux/nanotes.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NaNotes
          Comment=Floating Markdown scratchpad backed by local files
          Exec=nanotes
          Icon=nanotes
          Terminal=false
          Categories=Utility;TextEditor;
          StartupWMClass=nanotes
          EOF
          ASSET="release-assets/nanotes_${APP_VERSION}_linux_x86_64.tar.gz"
          tar -czf "$ASSET" -C stage-linux nanotes nanotes.desktop nanotes.png
          if [ -f install.sh ]; then
            sh -n install.sh
          fi
          ls -lh release-assets

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest, checksums, and publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          python3 - "$VERSION" "$RELEASE_TAG" "$BASE_URL" <<'PY'
          import datetime, glob, json, os, sys

          version, tag, base_url = sys.argv[1:4]
          patterns = {
              "darwin-aarch64": "release-assets/*_aarch64.app.tar.gz",
              "darwin-x86_64": "release-assets/*_x64.app.tar.gz",
              "windows-x86_64": "release-assets/*-setup.exe",
          }
          platforms = {}
          for key, pattern in patterns.items():
              matches = sorted(glob.glob(pattern))
              if not matches:
                  continue
              asset = matches[0]
              sig_path = asset + ".sig"
              if not os.path.isfile(sig_path):
                  continue
              with open(sig_path, "r", encoding="utf-8") as fh:
                  sig = fh.read().strip()
              if sig:
                  platforms[key] = {
                      "signature": sig,
                      "url": f"{base_url}/{os.path.basename(asset)}",
                  }

          if platforms:
              manifest = {
                  "version": version,
                  "notes": f"See https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              with open("release-assets/latest.json", "w", encoding="utf-8") as fh:
                  json.dump(manifest, fh, indent=2)
                  fh.write("\n")
              print(f"Generated release-assets/latest.json with platforms: {sorted(platforms)}")
          else:
              print("No updater .sig files found; skipping latest.json generation.")
          PY

          (cd release-assets && sha256sum *.tar.gz *.exe *.deb *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "NaNotes $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

          ARM_SHA=$(awk '/_aarch64\.app\.tar\.gz$/ { print $1 }' release-assets/SHA256SUMS.txt)
          X64_SHA=$(awk '/_x64\.app\.tar\.gz$/ { print $1 }' release-assets/SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$X64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap cask
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          ARM_SHA: ${{ steps.release.outputs.arm_sha }}
          X64_SHA: ${{ steps.release.outputs.x64_sha }}
        run: |
          cat > nanotes.rb <<EOF
          cask "nanotes" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${X64_SHA}"

            url "https://github.com/QuillDev/nanotes/releases/download/v#{version}/NaNotes_#{version}_#{arch}.app.tar.gz"
            name "NaNotes"
            desc "Floating Markdown scratchpad backed by local files"
            homepage "https://github.com/QuillDev/nanotes"

            app "NaNotes.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/NaNotes.app"],
                             must_succeed: false
            end

            caveats <<~EOS
              NaNotes is unsigned/ad-hoc signed, so this cask clears macOS quarantine on install.
              Press Option+N to toggle the overlay from any app, or Cmd+O to open settings.
            EOS

            zap trash: [
              "~/Library/Application Support/moe.quill.nanotes",
              "~/Library/Caches/moe.quill.nanotes",
              "~/Library/Preferences/moe.quill.nanotes.plist",
            ]
          end
          EOF

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Skipping Homebrew tap push: HOMEBREW_TAP_TOKEN secret is not configured."
            {
              echo "### Generated \`Casks/nanotes.rb\`"
              echo '```ruby'
              cat nanotes.rb
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/QuillDev/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp nanotes.rb tap/Casks/nanotes.rb
          rm -f tap/Formula/nanotes.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nanotes.rb
          git add -u Formula/nanotes.rb 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "nanotes ${VERSION}"
            git push
          fi

      - name: Check WinGet publishing prerequisites
        id: winget_check
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "Skipping WinGet publish: WINGET_TOKEN secret is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/q/QuillDev/nanotes >/dev/null 2>&1; then
            echo "Skipping WinGet publish: QuillDev.nanotes is not yet in microsoft/winget-pkgs (submit initial manifest first; see docs/RELEASING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish update to WinGet
        if: steps.winget_check.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: QuillDev.nanotes
          installers-regex: '-setup\.exe$'
          release-tag: ${{ needs.build.outputs.release_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
