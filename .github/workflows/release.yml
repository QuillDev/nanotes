name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets to (e.g. v0.3.4). Leave empty for build-only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            arch_label: aarch64
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app
            arch_label: x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch_label: x64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            arch_label: x86_64
    runs-on: ${{ matrix.os }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - name: Determine release target
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "release_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.release_tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: bun run tauri:build -- --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Package macOS release asset
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          mkdir -p release-assets
          APP_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          APP_PATH="$APP_DIR/NaNotes.app"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          ASSET="release-assets/NaNotes_${APP_VERSION}_${{ matrix.arch_label }}.app.tar.gz"
          tar -czf "$ASSET" -C "$APP_DIR" NaNotes.app
          ls -lh "$ASSET"

      - name: Package Windows release asset
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Expected NSIS *-setup.exe installer was not produced.'
          }
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets/
          Get-ChildItem release-assets
          if (Test-Path "$PWD\install.ps1") {
            $script = Get-Content -Raw -Path "$PWD\install.ps1"
            [void][scriptblock]::Create($script)
            powershell.exe -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw -Path '$PWD\install.ps1'))"
          }

      - name: Package Linux release assets
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          mkdir -p release-assets stage-linux
          BIN_PATH="src-tauri/target/${{ matrix.target }}/release/nanotes"
          DEB_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' | head -n 1)
          test -x "$BIN_PATH"
          test -n "$DEB_PATH"
          cp "$DEB_PATH" release-assets/
          cp "$BIN_PATH" stage-linux/nanotes
          chmod +x stage-linux/nanotes
          cp src-tauri/icons/128x128.png stage-linux/nanotes.png
          cat > stage-linux/nanotes.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NaNotes
          Comment=Floating Markdown scratchpad backed by local files
          Exec=nanotes
          Icon=nanotes
          Terminal=false
          Categories=Utility;TextEditor;
          StartupWMClass=nanotes
          EOF
          ASSET="release-assets/nanotes_${APP_VERSION}_linux_x86_64.tar.gz"
          tar -czf "$ASSET" -C stage-linux nanotes nanotes.desktop nanotes.png
          if [ -f install.sh ]; then
            sh -n install.sh
          fi
          ls -lh release-assets

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

          VERSION="${RELEASE_TAG#v}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "NaNotes $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

          ARM_SHA=$(awk '/_aarch64\.app\.tar\.gz$/ { print $1 }' release-assets/SHA256SUMS.txt)
          X64_SHA=$(awk '/_x64\.app\.tar\.gz$/ { print $1 }' release-assets/SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$X64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap cask
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          ARM_SHA: ${{ steps.release.outputs.arm_sha }}
          X64_SHA: ${{ steps.release.outputs.x64_sha }}
        run: |
          cat > nanotes.rb <<EOF
          cask "nanotes" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${X64_SHA}"

            url "https://github.com/QuillDev/nanotes/releases/download/v#{version}/NaNotes_#{version}_#{arch}.app.tar.gz"
            name "NaNotes"
            desc "Floating Markdown scratchpad backed by local files"
            homepage "https://github.com/QuillDev/nanotes"

            app "NaNotes.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/NaNotes.app"],
                             must_succeed: false
            end

            caveats <<~EOS
              NaNotes is unsigned/ad-hoc signed, so this cask clears macOS quarantine on install.
              Press Option+N to toggle the overlay from any app, or Cmd+O to open settings.
            EOS

            zap trash: [
              "~/Library/Application Support/moe.quill.nanotes",
              "~/Library/Caches/moe.quill.nanotes",
              "~/Library/Preferences/moe.quill.nanotes.plist",
            ]
          end
          EOF

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Skipping Homebrew tap push: HOMEBREW_TAP_TOKEN secret is not configured."
            {
              echo "### Generated \`Casks/nanotes.rb\`"
              echo '```ruby'
              cat nanotes.rb
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/QuillDev/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp nanotes.rb tap/Casks/nanotes.rb
          rm -f tap/Formula/nanotes.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nanotes.rb
          git add -u Formula/nanotes.rb 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "nanotes ${VERSION}"
            git push
          fi

      - name: Check WinGet publishing prerequisites
        id: winget_check
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "Skipping WinGet publish: WINGET_TOKEN secret is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/q/QuillDev/nanotes >/dev/null 2>&1; then
            echo "Skipping WinGet publish: QuillDev.nanotes is not yet in microsoft/winget-pkgs (submit initial manifest first; see docs/RELEASING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish update to WinGet
        if: steps.winget_check.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: QuillDev.nanotes
          installers-regex: '-setup\.exe$'
          release-tag: ${{ needs.build.outputs.release_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
